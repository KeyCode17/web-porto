pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check

commit-msg:
  commands:
    conventional:
      run: |
        grep -qE '^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\(.+\))?!?: .+' {1} \
          || { echo "commit message must follow Conventional Commits"; exit 1; }

pre-push:
  commands:
    fmt:
      run: cargo fmt --all -- --check
    clippy:
      run: cargo clippy --workspace --target wasm32-unknown-unknown --all-targets -- -D warnings
    test:
      run: cargo test --workspace
