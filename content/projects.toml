[[project]]
slug = "leafypuff"
title = "leafyPuff (Rust + Kotlin)"
short_description = "End-to-end encrypted Android diary over a shared Rust core"
long_description = "Android diary in Jetpack Compose over a Rust core bound through UniFFI: bunny-face moods, stickers, framed photos, calendar and statistics, a PIN and fingerprint lock, SQLite on the device and push-pull sync through an Axum API. End-to-end encrypted, with entries sealed per field on the device under an Argon2id-derived key and a recovery code, so the server stores only ciphertext. A TanStack operator console covers accounts, roles, audit, catalog, privacy requests and release gates."
