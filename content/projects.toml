[[project]]
slug = "px-solver"
title = "px-solver"
short_description = "Three-tier PerimeterX solver across 16 crates on crates.io"
long_description = "PerimeterX (HUMAN Security) challenge solver built as three tiers: a TTL cookie cache, a stealth-patched Chromium harvester over CDP, and a native _px3 sensor synthesizer reverse-engineered from the obfuscated init.js (base-91 string decoder, XOR and base64 splice cipher) so a solve no longer needs a browser, with Camoufox covering Cloudflare-fronted targets. 16 library crates published to crates.io, 25 numbered ADRs, and dual-use guardrails built into the design: Argon2id API keys, a per-domain allowlist with reviewed terms of service, and an audit log that never records cookie payloads. AGPL-3.0."
